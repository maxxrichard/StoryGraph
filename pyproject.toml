[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "storygraph"
version = "0.4.0"
description = "LLM content understanding and recommendation for long-form audio (audiobooks, podcasts, transcripts)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Maxx Richard Rahman" }]
keywords = ["audio", "llm", "recommender", "retrieval", "podcasts", "audiobooks", "asr"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "httpx>=0.26",
  "fastapi>=0.110",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
ml = ["torch>=2.2", "lightgbm>=4.3", "scikit-learn>=1.4"]
llm = ["transformers>=4.40", "peft>=0.10", "datasets>=2.18", "accelerate>=0.29", "sentence-transformers>=2.6"]
audio = ["faster-whisper>=1.0", "soundfile>=0.12", "librosa>=0.10"]
aws = ["boto3>=1.34", "sagemaker>=2.210"]
search = ["opensearch-py>=2.4"]
spark = ["pyspark>=3.5"]
serve = ["uvicorn[standard]>=0.29", "vllm>=0.4"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "ruff>=0.4",
  "mypy>=1.9",
  "pre-commit>=3.6",
  "types-PyYAML",
]
all = ["storygraph[ml,llm,audio,aws,search,spark,serve,dev]"]

[project.scripts]
storygraph = "storygraph.cli:app"

[project.urls]
Repository = "https://github.com/maxxrichard/StoryGraph"

[tool.hatch.build.targets.wheel]
packages = ["src/storygraph"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM"]
ignore = ["E501", "B905", "B008", "N803", "N806", "N812", "N818", "SIM905"]

[tool.ruff.lint.isort]
known-first-party = ["storygraph"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
packages = ["storygraph"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "ml: requires torch or lightgbm",
  "torch: requires torch (run separately from lightgbm tests on macOS; see conftest)",
  "lightgbm: requires lightgbm",
  "slow: long-running tests",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["storygraph"]
branch = true
