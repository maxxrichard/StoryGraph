# Online serving: vLLM for the tagger / summariser, FastAPI for recommendations.

vllm:
  model: meta-llama/Meta-Llama-3.1-8B-Instruct
  lora_modules:
    tagger: s3://storygraph-models/tagger-lora/v7
    summariser: s3://storygraph-models/summariser-lora/v3
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.90
  max_model_len: 8192
  max_num_seqs: 128
  enable_prefix_caching: true
  guided_decoding_backend: outlines
  endpoint: http://vllm.internal:8000/v1

api:
  host: 0.0.0.0
  port: 8080
  workers: 4
  timeout_s: 2.0
  llm_timeout_s: 20.0
  llm_retries: 2
  cache:
    summaries_ttl_s: 86400
    recs_ttl_s: 300

slo:
  recs_p95_ms: 120
  llm_p95_ms: 250
  availability: 0.999
